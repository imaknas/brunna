# Codex (docs/design/newcomer-path.md B4; docs/design/runtime-codex.md). What works: its sessions are served by the
# platform's user-level hooks (Step 2: letters at a session's start, notes reminders, the platform's rules), and reach the
# mailbox through brunna's MCP server (docs/mcp.md, registered by init); the weekly statistics read its session files. The
# platform's own runs (Step 1) use a copy of Codex in the platform's store, checked and promoted by brunna/update-runtimes,
# never your own: the judgment points that only answer (completions), then those that work in a copy of a memory branch;
# the rest stay on another runtime or an LLM provider, and doctor says which. They start only once the owner picks Codex in
# `agenthub llm setup` and says yes to login_use (they use the login), or pins a point. The first copy was promoted and
# ran a review on 11-25 (runtime-codex.md, Step 6). A sandboxed project's Codex sessions get nothing from the platform
# until Codex's own git is fenced (Step 4, git-config-fence.md).
# `agenthub init` offers it in its agent step and turns this module on when it is picked.
v: 1
name: codex
type: module
description: "your Codex chats get letters and notes reminders from the platform; brunna llm setup can have brunna's own decisions (nightly notes, weekly review) made with your Codex login; mailbox requests and agent jobs need another agent"
runtime_preset:
  label: Codex
  find: codex
  install:
  - '[ -s "$HOME/.nvm/nvm.sh" ] || curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash'
  - '. "$HOME/.nvm/nvm.sh" && nvm install --lts && nvm alias default "lts/*" && npm install -g @openai/codex'
  credential:
    kind: tool-login
    command: [codex, login]
    status: [codex, login, status]
  # asked by agenthub llm setup before the platform's decisions are made with this agent's own login (the owner's own yes:
  # never --yes, an answers file or an agent)
  login_use: "Let Codex make brunna's own decisions with your Codex login? The nightly notes, the first look at a project, the weekly review and your projects' own model calls then run on it and send what they read (notes, README, commit titles) to OpenAI, on your ChatGPT plan, or billed per use if you signed in with an API key (brunna can't tell the cost, so with llm.budget set it makes no decisions). brunna downloads its own checked copy (about 380 MB), checks it every day with about 20 small calls, and raises your own codex to the version it checked. To stop: brunna llm setup"
  # global in ~/.codex/config.toml, shared with the Codex (ChatGPT) desktop app
  mcp_register: [codex, mcp, add, "{server}", --, "{cli}", mcp]
  # agenthub uninstall
  mcp_unregister: [codex, mcp, remove, "{server}"]
  settings:
    runtime:
      # its sessions are served: installed joins what the instance has (apply_agent keeps the others). Not the default: it
      # can't handle the mailbox or agent jobs. brunna's own decisions on it are llm setup's question (login_use)
      default: none
      installed: [codex]
    modules:
      codex: true
jobs:
# does the login the platform's Codex runs share still work (no model call): the login file, the file store, `codex
# login status` through a run home on the checked copy. Nothing is checked, and nothing alerts, while the platform runs no
# work on Codex (runtime_ports.platform_work). The login file isn't declared under secrets: check-secrets would check it
# for a Codex only installed for sessions, at a fixed ~/.codex whatever $CODEX_HOME says; this job reads it where Codex
# keeps it (runtime_codex.codex_home), and only when the platform uses it
- name: codex-login
  every: 1h
  run: bin/py bin/check-runtime-login.py --runtime codex
  found_exit: true   # it sends what it finds (alert-routing.md step 3)
