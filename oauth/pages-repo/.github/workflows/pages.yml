# The Pages site of brunna's shared OAuth client (docs/design/platform-credentials.md C2a): it serves one file,
# https://brunna-dev.github.io/oauth/client.json, and nothing else. This file is a template kept in brunna's repository
# (oauth/pages-repo/); the owner copies it into brunna-dev/brunna-dev.github.io once. Every action is pinned by commit
# SHA (the tag in the comment is what it was on 11-15); the github-pages environment there is restricted to main.
name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Stage only the client document
        run: |
          set -eu
          # the document as it should be: its own URL, a public client, loopback redirects only
          test -f oauth/client.json && test ! -L oauth/client.json
          python3 - oauth/client.json <<'EOF'
          import json, sys, urllib.parse
          d = json.load(open(sys.argv[1]))
          assert d["client_id"] == "https://brunna-dev.github.io/oauth/client.json", "client_id is not this site's URL"
          assert d.get("token_endpoint_auth_method") == "none", "not a public client"
          assert not {"client_secret", "client_secret_expires_at", "jwks", "jwks_uri"} & set(d), "a public client has no keys"
          for uri in d["redirect_uris"]:
              u = urllib.parse.urlsplit(uri)
              assert u.scheme == "http" and u.hostname == "127.0.0.1" and not u.query, f"not loopback: {uri}"
          EOF
          mkdir -p _site/oauth
          cp oauth/client.json _site/oauth/client.json
          # exactly that one regular file, and no links (upload-pages-artifact serves the folder's contents)
          test "$(find _site -mindepth 1 ! -type d | wc -l | tr -d ' ')" = 1
          test -z "$(find _site -type l)"
          test -f _site/oauth/client.json && test ! -L _site/oauth/client.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
